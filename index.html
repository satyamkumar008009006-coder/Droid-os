<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131f">
<title>Liquid Glass — iPhone Web OS</title>
<style>
:root{--accent:#8ea8ff;--glass:rgba(255,255,255,.13);--line:rgba(255,255,255,.2);--text:#fff;--muted:rgba(255,255,255,.68);--blur:24px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--text);background:#111}
button,input,textarea{font:inherit}button{color:inherit;border:0;cursor:pointer}
.wallpaper{position:fixed;inset:0;background:radial-gradient(ellipse at 18% 20%,#f4a4bb 0,transparent 33%),radial-gradient(ellipse at 78% 28%,#7898f6 0,transparent 35%),radial-gradient(ellipse at 55% 88%,#7454b9 0,transparent 40%),linear-gradient(145deg,#101c39,#282044 55%,#111827);transition:filter .4s}
.wallpaper:before,.wallpaper:after{content:"";position:absolute;border-radius:50%;filter:blur(50px);opacity:.55;animation:float 14s ease-in-out infinite alternate}
.wallpaper:before{width:45vw;height:45vw;left:22%;top:24%;background:linear-gradient(120deg,#ffc3d7,#729aff);mix-blend-mode:screen}
.wallpaper:after{width:35vw;height:35vw;right:4%;bottom:2%;background:#8b5cf6;animation-delay:-5s}
@keyframes float{to{transform:translate(8vw,-5vh) scale(1.15)}}
.status{position:absolute;top:0;left:0;right:0;height:48px;padding:13px 26px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:650;z-index:5;text-shadow:0 1px 5px #333}
.statusRight{display:flex;gap:7px;align-items:center}.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:126px;height:34px;border-radius:22px;background:#050505;box-shadow:0 2px 12px #0008;z-index:10;display:flex;align-items:center;justify-content:center;gap:8px}.island .tiny{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80}
.screen{position:absolute;inset:48px 0 0;padding:18px clamp(18px,5vw,60px) 42px;display:flex;flex-direction:column;max-width:1100px;margin:auto;left:0;right:0}
.date{font-size:14px;color:#ffffffc9;font-weight:550;margin:4px 0 5px}.greeting{font-size:clamp(34px,6vw,54px);letter-spacing:-2px;font-weight:650;margin:0 0 18px;text-shadow:0 2px 16px #0003}
.widgetRow{display:grid;grid-template-columns:1.15fr .85fr;gap:13px;max-width:600px;margin-bottom:22px}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(var(--blur)) saturate(160%);-webkit-backdrop-filter:blur(var(--blur)) saturate(160%);box-shadow:0 12px 35px #0002,inset 0 1px 0 #ffffff25;border-radius:25px}
.widget{padding:15px 17px;min-height:100px}.widget .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}.weatherBig{font-size:34px;font-weight:550;margin-top:6px}.weatherSub{font-size:12px;color:var(--muted)}.calendarDay{font-size:36px;font-weight:600;line-height:1.1;margin-top:5px}
.appGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:19px 12px;max-width:570px;align-content:start}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;min-width:0;padding:0;transition:transform .16s}.app:active{transform:scale(.9)}
.icon{width:clamp(54px,8vw,68px);height:clamp(54px,8vw,68px);border-radius:19px;display:grid;place-items:center;font-size:29px;box-shadow:0 7px 18px #0003,inset 0 1px 0 #ffffff65;border:1px solid #ffffff38;position:relative;overflow:hidden}
.icon:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,#ffffff50,transparent 48%);pointer-events:none}
.app span:last-child{font-size:12px;text-shadow:0 1px 5px #000b;white-space:nowrap}
.dock{margin:auto auto 0;display:flex;justify-content:center;gap:clamp(10px,3vw,22px);padding:12px 18px;border-radius:30px;background:#ffffff24;border:1px solid #ffffff3b;backdrop-filter:blur(30px);box-shadow:0 12px 35px #0003;max-width:100%}
.dock .icon{width:57px;height:57px;border-radius:17px}.dock button{background:none;padding:0}
.homeIndicator{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:115px;height:5px;background:#ffffffd9;border-radius:8px;z-index:20}
.window{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:58px 14px 35px;background:#0002}.window.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{width:min(680px,100%);height:min(690px,100%);border-radius:30px;background:rgba(24,28,43,.76);border:1px solid #ffffff40;backdrop-filter:blur(35px) saturate(150%);box-shadow:0 25px 80px #0007;overflow:hidden;display:flex;flex-direction:column;animation:pop .25s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:translateY(20px) scale(.96);opacity:.4}to{transform:none;opacity:1}}
.panelHead{height:62px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #ffffff20}.panelHead h2{font-size:17px;margin:0}.close{width:30px;height:30px;border-radius:50%;background:#ffffff25;font-size:20px}.panelBody{padding:20px;overflow:auto;flex:1}
.tileGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tile{padding:17px;border-radius:20px;background:#ffffff17;border:1px solid #ffffff22;min-height:90px}.tile b{display:block;margin:8px 0 4px}.tile small{color:var(--muted)}
.action{padding:11px 15px;border-radius:14px;background:var(--accent);color:#11182c;font-weight:650;margin:5px 4px 5px 0}.secondary{background:#ffffff20;color:white}
.field{width:100%;padding:13px 14px;border-radius:14px;border:1px solid #ffffff30;background:#ffffff12;color:white;outline:none;margin:7px 0}.field::placeholder{color:#ffffff88}textarea.field{min-height:120px;resize:vertical}
.calc{max-width:330px;margin:auto}.calcDisplay{width:100%;text-align:right;font-size:43px;padding:20px 8px;background:transparent;border:0;color:white}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.keys button{aspect-ratio:1;border-radius:50%;font-size:22px;background:#ffffff20}.keys button.op{background:#f5a84c;color:#171717}.keys button.alt{background:#d4d4d4;color:#171717}
.notesList{display:flex;flex-direction:column;gap:8px}.noteItem{padding:12px;border-radius:13px;background:#ffffff14;text-align:left}
.quick{position:absolute;inset:0;z-index:25;background:#101522c9;backdrop-filter:blur(30px);display:none;padding:70px 20px 30px}.quick.show{display:block}.quickTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.quickGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.quick button{padding:18px;border-radius:22px;background:#ffffff20;text-align:left}.quick button.on{background:#8ea8ff;color:#10182b}
.toast{position:absolute;bottom:65px;left:50%;transform:translateX(-50%);background:#111c;color:white;padding:11px 17px;border-radius:20px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}.toast.show{opacity:1}
@media(max-width:520px){.screen{padding:15px 22px 42px}.widgetRow{gap:9px}.widget{padding:13px;min-height:92px}.appGrid{gap:18px 8px}.icon{border-radius:17px}.dock{gap:12px;padding:10px 13px}.dock .icon{width:51px;height:51px}.greeting{margin-bottom:14px}.panel{border-radius:25px}}
@media(min-width:850px){.screen{padding-top:28px}.appGrid{gap:23px 18px}.widgetRow{margin-bottom:28px}}
</style>
</head>
<body>
<div class="wallpaper" id="wallpaper"></div>
<div class="status"><span id="clock">9:41</span><div class="island"><span class="tiny"></span><span style="font-size:9px;color:#ddd">LIVE</span></div><span class="statusRight">◉ ◉ ▰ <span id="battery">100%</span></span></div>
<main class="screen">
  <div class="date" id="date">Wednesday, November 4</div>
  <h1 class="greeting">Good morning<span style="color:#c9d4ff">.</span></h1>
  <section class="widgetRow">
    <div class="widget glass"><div class="eyebrow">Weather · Your day</div><div class="weatherBig">☀️ 26°</div><div class="weatherSub" id="weatherText">Clear skies · Have a lovely day</div></div>
    <div class="widget glass"><div class="eyebrow">Today</div><div class="calendarDay" id="dayNum">04</div><div class="weatherSub" id="weekday">Wednesday</div></div>
  </section>
  <section class="appGrid" id="apps"></section>
  <nav class="dock" id="dock"></nav>
</main>
<div class="homeIndicator" onclick="closeApp()"></div>
<section class="window" id="window"><div class="panel"><header class="panelHead"><h2 id="appTitle">App</h2><button class="close" onclick="closeApp()">×</button></header><div class="panelBody" id="appBody"></div></div></section>
<section class="quick" id="quick"><div class="quickTop"><h2>Control Centre</h2><button class="close" onclick="toggleQuick()">×</button></div><div class="quickGrid">
<button id="wifi" onclick="toggleTile('wifi')">◉ <b>Wi‑Fi</b><br><small>Connected</small></button><button id="bluetooth" onclick="toggleTile('bluetooth')">ᛒ <b>Bluetooth</b><br><small>On</small></button><button id="airplane" onclick="toggleTile('airplane')">✈ <b>Airplane Mode</b><br><small>Off</small></button><button id="dark" onclick="toggleTile('dark')">◐ <b>Appearance</b><br><small>Liquid Glass</small></button><button onclick="toast('Brightness adjusted')">☀ <b>Brightness</b><br><small>Tap to adjust</small></button><button onclick="flashlight()">🔦 <b>Flashlight</b><br><small>Screen light</small></button></div><p style="color:#ffffff99;font-size:12px;margin-top:22px">A browser simulation. System radios and hardware controls remain managed by your device.</p></section>
<div class="toast" id="toast"></div>
<script>
const apps=[
 ['Phone','📞','#35c86b'],['Messages','💬','#39b9ef'],['Safari','🧭','#4e9df7'],['Photos','🌈','#f8f5f5'],
 ['Camera','📷','#777b86'],['Calculator','🧮','#424650'],['Notes','📝','#f2c94c'],['Clock','⏱️','#252b3a'],
 ['Calendar','📅','#f4f4f4'],['Music','🎵','#fa4b74'],['Weather','🌤️','#479cf3'],['Files','📁','#4e9df7'],
 ['App Store','🅰️','#279cf0'],['Settings','⚙️','#777e8c'],['Flashlight','🔦','#777e8c'],['App Studio','🧩','#9165dc']
];
const dockApps=['Phone','Messages','Safari','Music'];
const appsEl=document.getElementById('apps'),dock=document.getElementById('dock');
function iconFor(a){return apps.find(x=>x[0]===a)}
apps.forEach(a=>{let b=document.createElement('button');b.className='app';b.innerHTML=`<span class="icon" style="background:${a[2]}">${a[1]}</span><span>${a[0]}</span>`;b.onclick=()=>openApp(a[0]);appsEl.append(b)});
dockApps.forEach(n=>{let a=iconFor(n),b=document.createElement('button');b.innerHTML=`<span class="icon" style="background:${a[2]}">${a[1]}</span>`;b.onclick=()=>openApp(n);dock.append(b)});
function updateTime(){let d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});document.getElementById('dayNum').textContent=String(d.getDate()).padStart(2,'0');document.getElementById('weekday').textContent=d.toLocaleDateString([],{weekday:'long'})}
updateTime();setInterval(updateTime,10000);
let toastTimer;function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2100)}
function closeApp(){document.getElementById('window').classList.remove('show')}
function openApp(name){let body=document.getElementById('appBody'),title=document.getElementById('appTitle');title.textContent=name;body.innerHTML='';document.getElementById('window').classList.add('show');
const btn=(s,fn,cls='action')=>{let b=document.createElement('button');b.className=cls;b.textContent=s;b.onclick=fn;return b};
if(name==='Calculator'){let wrap=document.createElement('div');wrap.className='calc';wrap.innerHTML='<input class="calcDisplay" id="display" value="0" readonly><div class="keys" id="keys"></div>';body.append(wrap);let keys=['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','=',''];let d=wrap.querySelector('#display');keys.filter(Boolean).forEach(k=>{let b=document.createElement('button');b.textContent=k;b.className=['÷','×','−','+','='].includes(k)?'op':['AC','±','%'].includes(k)?'alt':'';b.onclick=()=>{if(k==='AC')d.value='0';else if(k==='='){try{d.value=String(Function('return '+d.value.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-'))())}catch{d.value='Error'}}else if(k==='±')d.value=String(-Number(d.value));else if(k==='%')d.value=String(Number(d.value)/100);else d.value=d.value==='0'?k:d.value+k};wrap.querySelector('#keys').append(b)})}
else if(name==='Notes'){let saved=localStorage.getItem('lg_notes')||'';body.innerHTML='<h3>Quick Notes</h3><textarea class="field" id="note" placeholder="Write something..."></textarea>';body.querySelector('#note').value=saved;body.append(btn('Save note',()=>{localStorage.setItem('lg_notes',body.querySelector('#note').value);toast('Note saved on this device')}))}
else if(name==='Phone'){body.innerHTML='<h3>Keypad</h3><input class="field" id="number" placeholder="Enter phone number" inputmode="tel"><div id="pad" class="keys"></div>';let pad=body.querySelector('#pad'),n=body.querySelector('#number');['1','2','3','4','5','6','7','8','9','*','0','#'].forEach(x=>{let b=btn(x,()=>n.value+=x,'secondary');pad.append(b)});body.append(btn('Call',()=>{if(n.value)location.href='tel:'+n.value;else toast('Enter a number first')}),btn('Clear',()=>n.value='','secondary'))}
else if(name==='Messages'){body.innerHTML='<h3>Compose message</h3><input class="field" id="smsno" placeholder="Phone number" inputmode="tel"><textarea class="field" id="smsbody" placeholder="Message"></textarea>';body.append(btn('Open Messages',()=>{let n=body.querySelector('#smsno').value,m=body.querySelector('#smsbody').value;location.href='sms:'+n+'?body='+encodeURIComponent(m)}))}
else if(name==='Safari'){body.innerHTML='<h3>Search the web</h3><form id="search"><input class="field" id="query" placeholder="Search Google or enter URL"><button class="action">Search</button></form><p style="color:#ffffff99">Opens results in a new browser tab.</p>';body.querySelector('form').onsubmit=e=>{e.preventDefault();let q=body.querySelector('#query').value;window.open(/^https?:\/\//i.test(q)?q:'https://www.google.com/search?q='+encodeURIComponent(q),'_blank')}}
else if(name==='Photos'){body.innerHTML='<h3>Photo Library</h3><p style="color:#ffffffaa">Choose images from your device. Files stay in your browser session.</p><input class="field" type="file" accept="image/*" multiple id="photos"><div id="preview" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"></div>';body.querySelector('#photos').onchange=e=>{let p=body.querySelector('#preview');p.innerHTML='';[...e.target.files].forEach(f=>{let img=document.createElement('img');img.src=URL.createObjectURL(f);img.style='width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px';p.append(img)})}}
else if(name==='Camera'){body.innerHTML='<video id="video" autoplay playsinline style="width:100%;border-radius:18px;background:#000"></video><p style="color:#ffffff99">Camera access requires HTTPS or localhost and your permission.</p>';navigator.mediaDevices?.getUserMedia({video:true}).then(s=>body.querySelector('#video').srcObject=s).catch(()=>toast('Camera permission unavailable'))}
else if(name==='Clock'){body.innerHTML=`<div style="text-align:center;padding:35px 0"><div style="font-size:58px;font-weight:300" id="bigclock">--:--:--</div><p>Local time</p></div><h3>Stopwatch</h3><div id="sw" style="font-size:30px">00:00.0</div>`;let start=0,elapsed=0,timer=null;let area=body.querySelector('#sw');body.append(btn('Start / Pause',()=>{if(timer){clearInterval(timer);timer=null;elapsed+=Date.now()-start}else{start=Date.now();timer=setInterval(()=>{let ms=elapsed+Date.now()-start;area.textContent=(ms/60000|0).toString().padStart(2,'0')+':'+((ms/1000|0)%60).toString().padStart(2,'0')+'.'+(ms%1000/100|0)},100)}}),btn('Reset',()=>{clearInterval(timer);timer=null;elapsed=0;area.textContent='00:00.0'},'secondary'));let tick=()=>body.querySelector('#bigclock')&&(body.querySelector('#bigclock').textContent=new Date().toLocaleTimeString());tick();setInterval(tick,1000)}
else if(name==='Calendar'){body.innerHTML=`<h3>${new Date().toLocaleDateString([],{month:'long',year:'numeric'})}</h3><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center" id="cal"></div>`;let c=body.querySelector('#cal'),d=new Date(),first=new Date(d.getFullYear(),d.getMonth(),1).getDay(),count=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();['S','M','T','W','T','F','S'].forEach(x=>c.innerHTML+=`<b style="padding:8px">${x}</b>`);for(let i=0;i<first;i++)c.innerHTML+='<span></span>';for(let i=1;i<=count;i++)c.innerHTML+=`<span style="padding:10px;border-radius:12px;background:${i===d.getDate()?'#8ea8ff;color:#111':'#ffffff12'}">${i}</span>`}
else if(name==='Music'){body.innerHTML='<div style="text-align:center;padding:35px 0"><div style="font-size:85px">🎧</div><h2>Music Player</h2><p style="color:#ffffff99">Play audio files stored on your device</p><input class="field" id="audiofile" type="file" accept="audio/*"><audio id="audio" controls style="width:100%;margin-top:20px"></audio></div>';body.querySelector('#audiofile').onchange=e=>{if(e.target.files[0])body.querySelector('#audio').src=URL.createObjectURL(e.target.files[0])}}
else if(name==='Weather'){body.innerHTML='<h3>Weather</h3><p>Get current weather using your approximate coordinates (permission required).</p>';body.append(btn('Use my location',()=>{navigator.geolocation?.getCurrentPosition(async pos=>{try{let u=`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m`;let r=await fetch(u),j=await r.json();body.querySelector('#weatherResult').textContent=`${j.current.temperature_2m}°C · Humidity ${j.current.relative_humidity_2m}% · Wind ${j.current.wind_speed_10m} km/h`}catch{toast('Weather service unavailable')}},()=>toast('Location permission denied'))}));body.innerHTML+='<p id="weatherResult" class="tile">No live data loaded yet.</p>'}
else if(name==='Files'){body.innerHTML='<h3>Browse files</h3><input class="field" type="file" id="files" multiple><p id="filelist" style="color:#ffffffaa"></p>';body.querySelector('#files').onchange=e=>body.querySelector('#filelist').textContent=[...e.target.files].map(f=>f.name+' · '+Math.round(f.size/1024)+' KB').join('\\n')}
else if(name==='App Store'){body.innerHTML='<h3>Mini App Gallery</h3><div class="tileGrid"><div class="tile">🧮<b>Calculator</b><small>Built-in utility</small></div><div class="tile">📝<b>Notes</b><small>Local notes</small></div><div class="tile">🌦️<b>Weather</b><small>Live forecast</small></div><div class="tile">🧩<b>App Studio</b><small>Create mini apps</small></div></div><p style="color:#ffffff99">This demo includes local web apps, not native App Store downloads.</p>'}
else if(name==='Settings'){body.innerHTML='<h3>Personalise</h3><p>Choose a glass accent</p>';['#8ea8ff','#f6a6c1','#91e2c0','#ffc36e','#c3a3ff'].forEach(c=>{let b=btn('●',()=>{document.documentElement.style.setProperty('--accent',c);localStorage.setItem('lg_accent',c)},'secondary');b.style.color=c;b.style.fontSize='28px';body.append(b)});body.innerHTML+='<hr style="border-color:#ffffff22"><p>Wallpaper style</p>';body.append(btn('Aurora',()=>document.getElementById('wallpaper').style.filter='hue-rotate(0deg)'),btn('Dream',()=>document.getElementById('wallpaper').style.filter='hue-rotate(65deg)','secondary'),btn('Midnight',()=>document.getElementById('wallpaper').style.filter='hue-rotate(160deg)','secondary'),btn('Reset saved notes',()=>{localStorage.removeItem('lg_notes');toast('Notes cleared')},'secondary'))}
else if(name==='Flashlight'){body.innerHTML='<div style="text-align:center;padding:35px 0"><div style="font-size:85px">🔦</div><h2>Screen Flashlight</h2><p style="color:#ffffff99">Uses your display as a light. It cannot switch on the phone LED from a normal webpage.</p></div>';body.append(btn('Turn screen light on',flashlight))}
else if(name==='App Studio'){body.innerHTML='<h3>Create a mini app</h3><input class="field" id="appname" placeholder="App name"><textarea class="field" id="appcode" placeholder="Write HTML for your mini app"><h1>Hello!</h1><p>My first mini app.</p></textarea>';body.append(btn('Preview mini app',()=>{let n=body.querySelector('#appname').value||'My Mini App',code=body.querySelector('#appcode').value;let w=window.open('','_blank');if(w){w.document.write('<!doctype html><title>'+n.replace(/[<>]/g,'')+'</title>'+code);w.document.close()}else toast('Allow pop-ups to preview')}));body.append(btn('Save mini app code',()=>{let a=document.createElement('a'),blob=new Blob([body.querySelector('#appcode').value],{type:'text/html'});a.href=URL.createObjectURL(blob);a.download=(body.querySelector('#appname').value||'mini-app')+'.html';a.click();URL.revokeObjectURL(a.href)},'secondary'));body.innerHTML+='<p style="color:#ffffff99">Mini apps run as web pages in a separate tab. This does not clone installed native apps.</p>'}
}
function flashlight(){document.body.classList.toggle('bright');let on=document.body.classList.contains('bright');document.getElementById('wallpaper').style.filter=on?'brightness(2.2) saturate(.3)':'none';toast(on?'Screen light on':'Screen light off')}
function toggleQuick(){document.getElementById('quick').classList.toggle('show')}
function toggleTile(id){let b=document.getElementById(id);b.classList.toggle('on');toast(id+' visual toggle changed')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeApp();document.getElementById('quick').classList.remove('show')}if(e.key==='q'&&e.altKey)toggleQuick()});
document.querySelector('.status').addEventListener('click',toggleQuick);
let accent=localStorage.getItem('lg_accent');if(accent)document.documentElement.style.setProperty('--accent',accent);
</script>
</body>
</html>
